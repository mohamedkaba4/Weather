<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MavenCrest | Weather</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="icon" type="image/svg+xml" href="mc web icon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Righteous&display=swap" rel="stylesheet">
    <style>
        :root {
            --deep-forest: #0a0f0a;
            --storm-accent: #5c7a67;
            --lightning-glow: #a8dadc;
            --text-main: #e0e0e0;
            --text-dim: #889c8d;
            --card-bg: rgba(10, 15, 10, 0.85);
            --border-glass: rgba(255, 255, 255, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            /* Blended background: Image + Gradient + Dark Overlay */
            background: 
                linear-gradient(rgba(10, 15, 10, 0.8), rgba(10, 15, 10, 0.8)), 
                url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&q=80&w=2560');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-blend-mode: multiply;
            
            color: var(--text-main);
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 3rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .header {
            border-left: 4px solid var(--storm-accent);
            padding-left: 15px;
            margin-bottom: 10px;
        }

        h1 {
            font-family: 'Righteous', cursive;
            font-size: 2rem;
            letter-spacing: 2px;
            color: var(--storm-accent);
            text-transform: uppercase;
        }

        .search-box {
            display: flex;
            background: var(--card-bg);
            border: 1px solid var(--border-glass);
            border-radius: 50px;
            padding: 6px;
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px 20px;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        button {
            background: var(--storm-accent);
            color: var(--deep-forest);
            border: none;
            padding: 0 25px;
            border-radius: 50px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: var(--lightning-glow);
            transform: scale(1.05);
        }

        .weather-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 2.5rem;
            display: none;
            backdrop-filter: blur(12px);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        .temp-display {
            font-size: 5.5rem;
            font-weight: 900;
            color: white;
            line-height: 1;
            margin: 15px 0;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        .city-name { font-size: 1.8rem; font-weight: 700; }
        .description { color: var(--text-dim); text-transform: uppercase; letter-spacing: 3px; font-size: 0.75rem; }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 2rem;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.04);
            padding: 15px;
            border-radius: 15px;
            border: 1px solid var(--border-glass);
        }

        .stat-label { font-size: 0.65rem; color: var(--text-dim); margin-bottom: 4px; text-transform: uppercase; }
        .stat-value { font-weight: 700; font-size: 1.2rem; color: var(--lightning-glow); }

        .loader { display: none; text-align: center; color: var(--storm-accent); font-weight: 700; letter-spacing: 1px; }
        .error { display: none; color: #ff6b6b; text-align: center; font-weight: 700; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>MAVENCREST</h1>
            <p id="clock" style="font-size: 0.8rem; color: var(--text-dim);"></p>
        </div>

        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Locate wilderness...">
            <button onclick="getWeather()">SEARCH</button>
        </div>

        <div id="loader" class="loader">CHASING HORIZONS...</div>
        <div id="error" class="error">TRACKING FAILED: CITY NOT FOUND</div>

        <div id="weatherCard" class="weather-card">
            <div class="city-name" id="cityName">---</div>
            <div class="description" id="desc">---</div>
            <div class="temp-display" id="temp">--°</div>
            
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-label">HUMIDITY</div>
                    <div class="stat-value" id="humidity">--%</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">WIND</div>
                    <div class="stat-value" id="wind">-- mph</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">PRESSURE</div>
                    <div class="stat-value" id="pressure">-- inHg</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">VISIBILITY</div>
                    <div class="stat-value" id="visibility">-- mi</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const INVOKE_URL = 'https://ugd23e5pc4.execute-api.us-east-2.amazonaws.com/weather';

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
        }
        setInterval(updateClock, 1000);
        updateClock();

        async function getWeather() {
            const city = document.getElementById('cityInput').value.trim();
            if (!city) return;

            const loader = document.getElementById('loader');
            const error = document.getElementById('error');
            const card = document.getElementById('weatherCard');

            loader.style.display = 'block';
            error.style.display = 'none';
            card.style.display = 'none';

            try {
                // Fetching with ?city=NAME. Your Lambda handles units if programmed, 
                // but we will ensure the frontend math/labels match English units.
                const response = await fetch(`${INVOKE_URL}?city=${encodeURIComponent(city)}`);
                if (!response.ok) throw new Error();

                const data = await response.json();
                const w = data.weatherData;

                // UI Updates
                document.getElementById('cityName').innerText = w.name;
                document.getElementById('desc').innerText = w.weather[0].description;
                
                // If your Lambda already fetches 'imperial', we just display. 
                // If Lambda is 'metric', we convert here for safety:
                const isMetric = w.main.temp < 50 && w.main.temp > -50; // Simple check if it's C or F
                const displayTemp = isMetric ? (w.main.temp * 9/5 + 32) : w.main.temp;
                const displayWind = isMetric ? (w.wind.speed * 2.237) : w.wind.speed;
                const displayVis = isMetric ? (w.visibility / 1609) : (w.visibility / 1000);

                document.getElementById('temp').innerText = Math.round(displayTemp) + '°';
                document.getElementById('humidity').innerText = w.main.humidity + '%';
                document.getElementById('wind').innerText = Math.round(displayWind) + ' mph';
                document.getElementById('pressure').innerText = (w.main.pressure * 0.02953).toFixed(2);
                document.getElementById('visibility').innerText = displayVis.toFixed(1) + ' mi';

                card.style.display = 'block';
            } catch (err) {
                error.style.display = 'block';
            } finally {
                loader.style.display = 'none';
            }
        }
    </script>
</body>
</html>
